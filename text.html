<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Page</title>
</head>
<body>

    <small id="date"></small>

    <h1>My Page Title</h1>

    <p>
        This is where your text goes. You can write anything you want here.
    </p>

        const today = new Date();

        const options = {
            day: "numeric",
            month: "long",
            year: "numeric"

        document.getElementById("date").textContent =
            today.toLocaleDateString("en-GB", options);
    </script>
